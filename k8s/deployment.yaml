apiVersion: apps/v1
kind: Deployment
metadata:
  name: phising-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phising-app
  template:
    metadata:
      labels:
        app: phising-app
    spec:
      containers:
      - name: phising-app-container
        # Replace with your Docker Hub username
        image: <YOUR_DOCKERHUB_USERNAME>/phising-ccd:latest
        ports:
        - containerPort: 5000